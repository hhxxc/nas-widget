name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 公开仓库方案：ipa 不内嵌密钥，Config.generated.swift 用仓库内的空值模板。
      # 地址与 Key 由用户在 App 设置页填写（App Group UserDefaults，App/Widget 共享）。
      # 若需编译期注入密钥（App Group 失效时的兜底），临时转私有仓库并恢复注入步骤。

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (unsigned, iphoneos)
        run: |
          cd ios
          xcodebuild \
            -project NASWidget.xcodeproj \
            -scheme TodoApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA (ldid pseudo-sign for TrollStore)
        run: |
          brew install ldid
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          APP_NAME=$(basename "$APP_PATH" .app)
          echo "app: $APP_PATH (bin $APP_NAME)"
          ldid -Sios/TodoApp/TodoApp.entitlements "$APP_PATH/$APP_NAME"
          for APPEX in "$APP_PATH/PlugIns/"*.appex; do
            EXT=$(basename "$APPEX" .appex)
            BIN="$APPEX/$EXT"
            ENT=""
            if [ "$EXT" = "TodoWidget" ] && [ -f ios/TodoWidget/TodoWidget.entitlements ]; then ENT=ios/TodoWidget/TodoWidget.entitlements; fi
            if [ "$EXT" = "TodayExt" ] && [ -f ios/TodayExt/TodayExt.entitlements ]; then ENT=ios/TodayExt/TodayExt.entitlements; fi
            echo "signing $EXT (ent: ${ENT:-none})"
            if [ -n "$ENT" ]; then ldid -S"$ENT" "$BIN"; else ldid -S "$BIN"; fi
          done
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry NASWidget.ipa Payload
          ls -la NASWidget.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NASWidget-ipa
          path: NASWidget.ipa

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NASWidget.ipa
          generate_release_notes: true
