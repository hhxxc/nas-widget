services:
  todo-api:
    build: ./backend
    image: nas-widget-api:latest
    container_name: nas-widget-api
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - MAX_USERS=5
      - REGISTER_CODE=CHANGE_ME_REGISTER_CODE
    volumes:
      - ./data:/data
      - ./web:/app/web:ro
